name: smart_travel_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI / fonts / icons
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Networking / utils
  url_launcher: ^6.2.6
  http: ^1.1.0
  shared_preferences: ^2.2.3
  intl: ^0.18.0

  # Charts
  fl_chart: ^1.1.1

  # Gemini client (only one entry)
  google_generative_ai: ^0.4.7

  # Location & maps
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  latlong2: ^0.9.1

  # Firebase
  firebase_auth: ^4.15.2
  firebase_core: ^2.24.2
  cloud_firestore: ^4.17.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
